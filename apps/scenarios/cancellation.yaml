# A task that is actively working and has already produced an artifact when
# cancellation is requested. Task cancellation stops playback and ends the
# stream before the scenario reaches its `completed` step.
id: cancellation
match:
  contains:
    - "repository migration"
steps:
  - event: status-update
    state: working
    message: "**Starting the repository migration.**"
  - event: status-update
    message: "**Scanning repository files for legacy references.**"
    delayMs: 1000
  - event: artifact-update
    artifact:
      artifactId: migration-progress-1
      name: "migration-progress.log"
      description: "Files migrated so far, before cancellation."
      metadata:
        kind: implementation-summary
      parts:
        - kind: text
          text: "Migrated 12 of 340 files."
    delayMs: 1000
  - event: status-update
    message: "**Continuing the migration across the remaining files.**"
    delayMs: 1000
  - event: status-update
    state: completed
    message: "**Completed the repository migration.**"
    final: true
    delayMs: 1000
