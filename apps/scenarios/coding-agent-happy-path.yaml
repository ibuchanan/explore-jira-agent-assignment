# Simulated Coding Remote Agent: a paced Markdown-rich coding task that
# demonstrates progress, internal thinking, tool activity, and artifacts.
# @see specs/tickets/05-coding-agent-content-happy-path.md
id: coding-agent-happy-path
match:
  contains:
    - "fix the login bug"
steps:
  - event: status-update
    state: working
    message: "## Starting login-bug fix\n\nI’m tracing the session lifecycle and will report each milestone."
  - event: status-update
    message: "### Investigation\n\n- Located the login/session code path\n- Comparing **refresh** and **validation** order"
    delayMs: 5000
  - event: status-update
    message: "> **Internal thinking**\n> Validation currently runs before token refresh. Reversing that order should preserve valid renewed sessions."
    delayMs: 5000
  - event: status-update
    message: "### Change plan\n\n1. Refresh the session token\n2. Validate the refreshed session\n3. Keep the existing failure handling"
    delayMs: 5000
  - event: artifact-update
    artifact:
      artifactId: patch-1
      name: "login-session-order.patch"
      description: "Reorders session validation to run after the token refresh."
      metadata:
        kind: patch
      parts:
        - kind: text
          text: "```diff\n--- a/session.ts\n+++ b/session.ts\n@@ refresh before validate\n+await refreshToken(session);\n validateSession(session);\n```"
    delayMs: 5000
  - event: artifact-update
    artifact:
      artifactId: patch-1
      parts:
        - kind: text
          text: "\n```diff\n@@ trailing whitespace cleanup\n-const valid = validateSession(session);  \n+const valid = validateSession(session);\n```"
    append: true
    lastChunk: true
    delayMs: 5000
  - event: status-update
    message: "### Verification\n\n\U0001F9EA **Running** the checkout test suite against the proposed change."
    delayMs: 5000
  - event: status-update
    message: "✅ **42 tests passed**\n\nThe checkout flow remains green after the session-order change."
    delayMs: 5000
  - event: artifact-update
    artifact:
      artifactId: implementation-summary-1
      name: "Login bug fix summary"
      description: "Reordered session validation so the token refresh runs first, verified by the checkout test suite."
      metadata:
        kind: implementation-summary
      parts:
        - kind: text
          text: "## Implementation summary\n\n- Refreshes the token **before** validation\n- Preserves existing validation behavior\n- Verified by the checkout test suite"
    delayMs: 5000
  - event: status-update
    state: completed
    message: "## ✅ Login bug fixed\n\nSession tokens now refresh before validation; the checkout suite passed."
    final: true
    delayMs: 5000
