# Demonstrates every remote-to-Jira action.
id: demo-jira
match:
  contains:
    - "jira callbacks"
steps:
  - event: status-update
    state: working
    message: "**Preparing Jira updates.**"
  - event: jira-callback
    action: read
  - event: jira-callback
    action: comment
  - event: jira-callback
    action: mention
  - event: jira-callback
    action: transition
  - event: status-update
    state: completed
    message: "**Finished the Jira updates.**"
    final: true
