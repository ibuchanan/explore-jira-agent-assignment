# Demonstrates an authorization need before a Jira transition.
id: jira-auth-required
match:
  contains:
    - "jira callback auth"
steps:
  - event: status-update
    state: working
    message: "**Preparing the Jira transition.**"
  - event: jira-callback
    action: transition
    result: auth-required
    message: "**The Jira transition needs authorization.**"
  - event: status-update
    state: working
    message: "**Resuming the Jira transition after authorization.**"
  - event: status-update
    state: completed
    message: "**Finished the authorized Jira transition.**"
    final: true
