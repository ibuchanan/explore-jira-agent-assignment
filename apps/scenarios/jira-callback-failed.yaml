# Demonstrates an unrecoverable post-acceptance Jira comment failure.
id: jira-callback-failed
match:
  contains:
    - "jira callback failed"
steps:
  - event: status-update
    state: working
    message: "**Preparing the Jira comment.**"
  - event: jira-callback
    action: comment
    result: failed
    message: "**The Jira comment failed after task acceptance.**"
