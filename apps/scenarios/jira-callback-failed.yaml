# Demonstrates an unrecoverable post-acceptance simulated Jira comment failure.
id: jira-callback-failed
match:
  contains:
    - "simulate failed jira callback"
steps:
  - event: status-update
    state: working
    message: "Preparing the simulated Jira comment."
  - event: jira-callback
    action: comment
    result: failed
    message: "Simulated Jira comment failed after acceptance; no Jira comment was created."
