# Interactive renderer-observation scenario: canonical A2A state transitions.
id: markdown-happy-path
match:
  contains:
    - "show markdown"
steps:
  - event: status-update
    state: working
    message: "# Markdown showcase"
  - event: status-update
    state: input-required
    message: "**Input required:** Reply `Continue` for the bold and italic example."
    waitForUserInput: true
  - event: status-update
    state: working
    message: "**Bold text** and *italic text* appear in this update."
  - event: status-update
    state: input-required
    message: "**Input required:** Reply `Continue` for the unordered list example."
    waitForUserInput: true
  - event: status-update
    state: working
    message: "- First list item\n- Second list item"
  - event: status-update
    state: input-required
    message: "**Input required:** Reply `Continue` for the ordered list example."
    waitForUserInput: true
  - event: status-update
    state: working
    message: "1. First ordered step\n2. Second ordered step"
  - event: status-update
    state: input-required
    message: "**Input required:** Reply `Continue` for the blockquote example."
    waitForUserInput: true
  - event: status-update
    state: working
    message: "> A short blockquote is useful for a highlighted observation."
  - event: status-update
    state: input-required
    message: "**Input required:** Reply `Continue` for the inline-code example."
    waitForUserInput: true
  - event: status-update
    state: working
    message: "Use `session.refresh()` before validation."
  - event: status-update
    state: input-required
    message: "**Input required:** Reply `Continue` for the code-block example."
    waitForUserInput: true
  - event: status-update
    state: working
    message: "```typescript\nconst refreshed = await session.refresh();\n```"
  - event: status-update
    state: input-required
    message: "**Input required:** Reply `Continue` for the final result."
    waitForUserInput: true
  - event: status-update
    state: working
    message: "Read the [A2A protocol](https://a2a-protocol.org/) for protocol context."
  - event: status-update
    state: completed
    message: "Read the [A2A protocol](https://a2a-protocol.org/) for protocol context.\n\n- [x] Markdown updates sent\n- [x] Showcase complete"
    final: true
