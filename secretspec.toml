[project]
name = "explore-rovo-agent-connector"
revision = "1.0"

[profiles.default]
FORGE_SITE = { description = "Forge CLI target site, e.g. example.atlassian.net", required = true }
FORGE_PRODUCT = { description = "Forge CLI target product (jira, confluence, etc.)", default = "jira" }
FORGE_ENVIRONMENT = { description = "Forge CLI target environment (development, staging, production)", default = "development" }
REMOTE_BASE_URL = { description = "Public HTTPS base URL of the remote agent service; the .invalid default is a bootstrap placeholder and must be replaced by scripts/tunnel.sh", default = "https://unconfigured.invalid" }
FORGE_APP_ID = { description = "Forge app ID accepted as the Forge Invocation Token audience by the remote", required = true }
